name: Deploy Unified (Site + Sorteo)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Caché de dependencias ──────────────────────────────────────────────
      - name: Cache node_modules (sorteo)
        uses: actions/cache@v4
        with:
          path: sorteo/node_modules
          key: sorteo-${{ hashFiles('sorteo/package-lock.json') }}

      - name: Cache node_modules (live-feed)
        uses: actions/cache@v4
        with:
          path: live-feed/node_modules
          key: live-feed-${{ hashFiles('live-feed/package-lock.json') }}

      - name: Cache node_modules (subasta-silenciosa)
        uses: actions/cache@v4
        with:
          path: subasta-silenciosa/node_modules
          key: subasta-${{ hashFiles('subasta-silenciosa/package-lock.json') }}

      # ── Instalar dependencias en paralelo ──────────────────────────────────
      - name: Install all dependencies (paralelo)
        run: |
          (cd sorteo && npm ci --prefer-offline) &
          (cd live-feed && npm ci --prefer-offline) &
          (cd subasta-silenciosa && npm ci --prefer-offline) &
          wait
          echo "✅ Todas las dependencias instaladas"

      # ── Build en paralelo ──────────────────────────────────────────────────
      - name: Build all apps (paralelo)
        env:
          VITE_ADMIN_PASSWORD:  ${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_MASTER_PASSWORD: ${{ secrets.VITE_MASTER_PASSWORD }}
        run: |
          (cd sorteo && VITE_ADMIN_PASSWORD=$VITE_ADMIN_PASSWORD npm run build) &
          (cd live-feed && VITE_MASTER_PASSWORD=$VITE_MASTER_PASSWORD npm run build) &
          (cd subasta-silenciosa && npm run build) &
          wait
          echo "✅ Todos los builds completados"

      # ── Estructura final ───────────────────────────────────────────────────
      - name: Create Final Build Structure
        run: |
          mkdir dist_final

          cp index.html dist_final/
          cp index.css  dist_final/
          cp script.js  dist_final/
          cp CNAME      dist_final/

          [ -d assets ] && cp -r assets dist_final/ || true
          [ -d SVG ]    && cp -r SVG    dist_final/ || true
          [ -f robots.txt ]  && cp robots.txt  dist_final/ || true
          [ -f sitemap.xml ] && cp sitemap.xml dist_final/ || true

          mkdir -p dist_final/sorteo
          cp -r sorteo/dist/* dist_final/sorteo/

          mkdir -p dist_final/live-feed
          cp -r live-feed/dist/* dist_final/live-feed/

          mkdir -p dist_final/subasta-silenciosa
          cp -r subasta-silenciosa/dist/* dist_final/subasta-silenciosa/

          # Copiamos con rsync para EXCLUIR node_modules y archivos pesados innecesarios
          [ -d curso-maleki ] && rsync -a --exclude='node_modules' --exclude='.git' curso-maleki/ dist_final/curso-maleki/ || true
          [ -d sitio-prueba ] && rsync -a --exclude='node_modules' --exclude='.git' sitio-prueba/ dist_final/sitio-prueba/ || true
          [ -d nueva_version ] && rsync -a \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.log' \
            nueva_version/ dist_final/nueva_version/ || true

          echo "📦 Tamaño dist_final:"
          du -sh dist_final/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist_final'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
